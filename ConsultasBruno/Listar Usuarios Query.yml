info:
  name: Listar Usuarios Query
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/usuarios?nome=pedro
  headers:
    - name: X-Usuario
      value: pedro
  params:
    - name: nome
      value: pedro
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
